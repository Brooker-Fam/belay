name: Android

# The emulator job enrolls the phone with a real server, so server changes run it too.
on:
  push:
    paths: ["android/**", "server/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "server/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      # Also validates the Gradle wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Shell scripts
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y shellcheck
          shellcheck -x -s bash android/scripts/*.sh
      - name: Build, unit tests, lint
        working-directory: android
        # The release build is unsigned here: the release key never leaves the family's computer.
        # One retry, only when the first attempt failed to download a dependency (a flaky
        # repository); any other failure fails the job at once.
        run: |
          tasks=(:core:test :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintDebug :app:lintRelease
            :fixture:assembleV1Debug :fixture:assembleV2Debug)
          if ! ./gradlew --stacktrace "${tasks[@]}" 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            if grep -qiE "could not resolve|could not get|could not download|connection reset|read timed out" "$RUNNER_TEMP/build.log"; then
              echo "::warning::A dependency download failed; retrying the build once."
              ./gradlew --stacktrace "${tasks[@]}"
            else
              exit 1
            fi
          fi
      - name: Collect APKs
        run: |
          mkdir -p apks
          cp android/app/build/outputs/apk/debug/app-debug.apk apks/
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk apks/
          cp android/fixture/build/outputs/apk/v1/debug/fixture-v1-debug.apk apks/
          cp android/fixture/build/outputs/apk/v2/debug/fixture-v2-debug.apk apks/
      # Debug-only parts (src/debug) must never reach a release build.
      - name: The release build has no debug-only parts
        run: |
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort | tail -n 1)"
          manifest="$("$aapt2" dump xmltree --file AndroidManifest.xml android/app/build/outputs/apk/release/app-release-unsigned.apk)"
          if grep -qE 'DebugRecoveryReceiver|DEBUG_RECOVER|DebugUsageReceiver|DEBUG_UPLOAD_USAGE|testOnly' <<<"$manifest"; then
            echo "::error::The release APK's manifest has debug-only parts."
            exit 1
          fi
      # Phase 6's self-update test: a second debug build of Belay, on this runner (so the same
      # debug key), with a higher version code, and not test-only: Android never lets an app
      # install a test-only APK through a PackageInstaller session. The first one is collected
      # above; this one is built after it.
      - name: A second debug build of Belay, for the self-update test
        working-directory: android
        run: |
          base="$(jq -r '.elements[0].versionCode' app/build/outputs/apk/debug/output-metadata.json)"
          code=$((base + 1))
          ./gradlew --stacktrace :app:assembleDebug -PbelayVersionCode="$code" -PbelayTestOnly=false
          cp app/build/outputs/apk/debug/app-debug.apk ../apks/app-debug-update.apk
          echo "$code" > ../apks/app-debug-update.version-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apks
          path: apks/
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            android/core/build/reports/
            android/app/build/reports/
          retention-days: 7

  emulator:
    name: Provision on the Android 17 emulator (${{ matrix.target }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # aosp_atd: the Automated Test Device image, no Google services. It must pass.
        # google_apis: with Google services, closer to a phone. Informational for now:
        # an account can appear on it after boot (see ci-emulator-test.sh).
        target: [aosp_atd, google_apis]
    continue-on-error: ${{ matrix.target == 'google_apis' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apks
          path: apks
      # A real Belay server on this machine, which the emulator reaches as 10.0.2.2.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Start a Belay server for the phone to enroll with
        env:
          BELAY_PUBLIC_URL: http://10.0.2.2:8080
          BELAY_DATA_DIR: ${{ runner.temp }}/belay-data
        run: |
          set -euo pipefail
          (cd server && npm ci --ignore-scripts --no-audit --no-fund && npm run build)
          nohup node server/dist/index.js > "$RUNNER_TEMP/belay-server.log" 2>&1 &
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:8080/healthz >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz
          code="$(node server/dist/cli.js create-code "CI phone" 2>/dev/null)"
          echo "BELAY_E2E_CODE=$code" >> "$GITHUB_ENV"
      - name: The self-update test's version code
        run: echo "BELAY_E2E_UPDATE_CODE=$(cat apks/app-debug-update.version-code)" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Android 17 without the Play Store, so no Play Protect prompts in CI.
      # 37.0 is the newest x86_64 image with 4 KB pages, like a Pixel 8.
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          BELAY_E2E_SERVER: http://10.0.2.2:8080
          BELAY_E2E_STATUS: BELAY_PUBLIC_URL=http://10.0.2.2:8080 BELAY_DATA_DIR=${{ runner.temp }}/belay-data node server/dist/cli.js status --json
          # Phase 2: the server's CLI, for setting rules and answering requests during the test.
          BELAY_E2E_CLI: BELAY_PUBLIC_URL=http://10.0.2.2:8080 BELAY_DATA_DIR=${{ runner.temp }}/belay-data node server/dist/cli.js
          # Phases 6 and 10: the update Belay installs on itself (BELAY_E2E_UPDATE_CODE is set above).
          BELAY_E2E_UPDATE_APK: apks/app-debug-update.apk
        with:
          api-level: "37.0"
          target: ${{ matrix.target }}
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: android/scripts/ci-emulator-test.sh apks/app-debug.apk apks/app-debug-androidTest.apk apks/fixture-v1-debug.apk apks/fixture-v2-debug.apk
      - name: The server's log
        if: always()
        run: cat "$RUNNER_TEMP/belay-server.log" || true
